name: booking-web
on:
  pull_request:
  push:
    branches: [main]
    paths: ['apps/booking-web/**', 'pnpm-lock.yaml', '.github/workflows/web.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/booking-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env: { NEXT_TELEMETRY_DISABLED: '1' }
