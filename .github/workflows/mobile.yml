name: mobile
on:
  pull_request:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Widget + golden tests
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: golden-failures, path: apps/mobile/test/**/failures/ }

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://api.example.com/api/v1' }}
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk }

  ios:
    needs: test
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      # Unsigned build verifies the iOS toolchain. Signed/TestFlight builds require
      # APPLE_CERTIFICATE / provisioning profile secrets (see docs/deployment.md).
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ vars.API_URL || 'https://api.example.com/api/v1' }}
