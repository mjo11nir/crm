name: api
on:
  pull_request:
  push:
    branches: [main]
    paths: ['services/api/**', 'pnpm-lock.yaml', '.github/workflows/api.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
      BCRYPT_ROUNDS: '4'
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - name: Type check
        run: pnpm typecheck
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Validate migrations match schema
        run: |
          psql postgresql://crm:crm@localhost:5432/crm_test -c 'CREATE DATABASE crm_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://crm:crm@localhost:5432/crm_shadow --exit-code
      - name: Unit + integration tests with coverage
        run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        with: { name: api-coverage, path: services/api/coverage }
      - name: Build
        run: pnpm build
