name: e2e
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U crm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
      NOTIFICATIONS_WORKER: 'off'
      API_INTERNAL_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cd tests && npx playwright install --with-deps chromium
      - name: API
        run: |
          cd services/api && npx prisma generate && npx prisma migrate deploy && pnpm seed && pnpm build
          nohup node dist/main.js > api.log 2>&1 &
      - name: Booking web
        run: |
          cd apps/booking-web && NEXT_TELEMETRY_DISABLED=1 pnpm build
          cp -r .next/static .next/standalone/apps/booking-web/.next/
          PORT=3001 nohup node .next/standalone/apps/booking-web/server.js > web.log 2>&1 &
      - run: npx wait-on -t 60000 http://localhost:3000/api/v1/health http://localhost:3001
      - run: cd tests && pnpm e2e
