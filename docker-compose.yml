# Local development stack. Secrets here are development-only placeholders.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  booking-web:
    build: { context: ., dockerfile: infrastructure/docker/booking-web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:3000/api/v1
    ports: ["3001:3001"]
    depends_on: [api]

volumes:
  pgdata:
